# Terpz710

# Message shown when a user enters an invalid (non-positive) number for the amount
positive-amount-only: "&cThe amount must be a positive number!"

# Message shown when trying to access a player's balance, but the player does not exist
# {name} is replaced with the player's name
player-does-not-have-balance: "&c{name}&f does not have a token balance!"

# Message shown when tokens are successfully added to a player's account
# {amount} is the number of tokens, and {name} is the player's name
successfully-added-tokens: "Successfully added &e{amount} tokens&f to &a{name}&f token balance!"

# Message displayed when a player checks their token balance
# {balance} is the player's current token balance
your-balance: "Balance: &e{balance} tokens"

# Message shown when a player tries to spend tokens but does not have enough
insufficient-tokens: "&cYou do not have enough tokens!"

# Message shown when a player successfully transfers tokens to another player
# {amount} is the number of tokens, and {name} is the recipient's name
successfully-paid-tokens: "Successfully paid &e{amount} tokens&f to &a{name}&f token balance!"

# Message shown when attempting to remove tokens from a player who does not have enough
# {name} is replaced with the player's name
not-enough-tokens: "&c{name}&f does not have enough tokens to remove!"

# Message shown when tokens are successfully removed from a player's account
# {amount} is the number of tokens, and {name} is the player's name
successfully-removed-tokens: "Successfully removed &e{amount} tokens&f from &a{name}&f token balance!"

# Message shown when a player's token balance cannot be retrieved
# {name} is the name of the player
could-not-retrieve-balance: "&cCould not retrieve the token balance for {name}!"

# Message displayed when viewing another player's token balance
# {name} is the player's name, and {balance} is their current token balance
players-balance: "&a{name}&f has &e{balance} tokens"

# Message shown when a player's token balance is successfully set to a specific amount
# {amount} is the new token balance, and {name} is the player's name
successfully-set-tokens: "Successfully set &a{name}&f token balance to &e{amount}&f!"